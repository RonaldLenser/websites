<!-- ====== TEXT (white version for dark bg) ====== -->
<g font-family="'Barlow Condensed','Arial Narrow',Impact,'Franklin Gothic Medium',sans-serif">
  <text x="224" y="80"  font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-1">CHASING</text>
  <text x="224" y="132" font-size="60" font-weight="900" fill="#FF4444" letter-spacing="-1">CARDS</text>
