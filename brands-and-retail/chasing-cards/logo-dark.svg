<!-- ====== FLYING CARDS ====== -->
<g transform="rotate(-18, 149, 74)" filter="url(#sh)">
  <rect x="132" y="50" width="34" height="48" rx="5" fill="#2DA412"/>
  <rect x="136" y="54" width="26" height="40" rx="3" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
